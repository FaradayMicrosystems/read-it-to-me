name: On-device tests

# Runs the real speech engine, MP3 encoder and PDF reader on an Android emulator.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb logcat -c || true
            gradle --no-daemon connectedDebugAndroidTest || (adb logcat -d -s NobodyTest NobodyGenerator AndroidRuntime TestRunner | tail -200; exit 1)
            adb logcat -d -s NobodyTest | tail -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-report
          path: app/build/reports/androidTests/
