name: Build APK

# Every push to main builds the APK and publishes a full release (v<baseVersion>).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOBODY_CHANNEL: release
      NOBODY_KS_PASS: ${{ secrets.NOBODY_KS_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.NOBODY_KEYSTORE_B64 }}
        run: |
          # Never ship a debug-signed APK: it won't install over the existing app.
          if [ -z "$KS_B64" ] || [ -z "$NOBODY_KS_PASS" ]; then
            echo "::error::Signing secrets NOBODY_KEYSTORE_B64 / NOBODY_KS_PASS are not set on this repo. Refusing to publish a debug-signed APK."
            exit 1
          fi
          # Strip whitespace/line breaks that sneak in when pasting the secret.
          KS_B64=$(printf %s "$KS_B64" | tr -d ' \r\n\t')
          NOBODY_KS_PASS=$(printf %s "$NOBODY_KS_PASS" | tr -d ' \r\n\t')
          # Safe diagnostics: lengths + short hash fingerprints only, never the values.
          echo "Keystore secret: ${#KS_B64} chars, fingerprint $(printf %s "$KS_B64" | sha256sum | cut -c1-16)"
          echo "Password secret: ${#NOBODY_KS_PASS} chars, fingerprint $(printf %s "$NOBODY_KS_PASS" | sha256sum | cut -c1-16)"
          printf %s "$KS_B64" | base64 -d > app/nobody.jks \
            || { echo "::error::NOBODY_KEYSTORE_B64 is not valid base64 (paste may be truncated or the wrong file)"; exit 1; }
          echo "::add-mask::$NOBODY_KS_PASS"
          echo "NOBODY_KS_PASS=$NOBODY_KS_PASS" >> "$GITHUB_ENV"
          keytool -list -keystore app/nobody.jks -storepass "$NOBODY_KS_PASS" -alias nobody > /dev/null \
            || { echo "::error::Keystore or password is wrong"; exit 1; }
          echo "Signing with the release key"

      - name: Unit tests
        run: gradle --no-daemon testReleaseUnitTest

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(sed -n 's/^val baseVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          TAG="v${VERSION}"
          NAME="Read It To Me ${TAG}"
          cp app/build/outputs/apk/release/app-release.apk "ReadItToMe-${TAG}.apk"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "file=ReadItToMe-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ${{ steps.apk.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
            On your phone: tap the .apk below, then allow "Install unknown apps" for your browser if asked.
